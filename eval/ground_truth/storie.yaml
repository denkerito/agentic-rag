      data_delibera_cda_abbandono: "2025-03-28"
      impatto_margine_marzo: "Riduzione del margine operativo di marzo al 4.84% rispetto a una media del 17-19%"

  - id: "ST-03"
    titolo: "Riduzione persistente del fatturato del cliente dominante Barilli Logistica da ottobre"
    descrizione: >
      Barilli Logistica S.p.A. (CLI-001) rappresenta il cliente dominante di OmniDen (~30% del fatturato).
      A seguito di una decisione strategica di riorganizzazione IT interna, Barilli comunica formalmente
      il 15 settembre 2025 (ai sensi dell'art. 4 del contratto CTR-008) l'internalizzazione del team di sviluppo.
      Di conseguenza, dal 1° ottobre 2025 la commessa viene ridotta al solo presidio specialistico L3 e monitoraggio,
      facendo scendere il fatturato mensile da circa 28.000,00 € a 12.000,00 € (-16.000,00 €/mese per ottobre,
      novembre e dicembre). Questo calo persistente abbatte il fatturato e porta i margini operativi dell'ultimo
      trimestre in territorio negativo.
