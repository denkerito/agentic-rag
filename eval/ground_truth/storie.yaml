  - id: "ST-06"
    titolo: "Fattura hardware duplicata e saldata due volte a ottobre"
    descrizione: >
      La fattura n. FT-2025-1089 del 14/10/2025 emessa da TechHardware Solutions S.r.l. (FOR-010) per l'importo
      di 1.850,00 € + IVA (totale 2.257,00 €) per l'acquisto di un notebook Dell XPS, è stata registrata per
      errore una seconda volta nei sistemi contabili in data 18/10/2025 con medesimo numero fornitore e importo.
      Di conseguenza, la società ha eseguito due distinti bonifici bancari di pari importo:
      - MOV-000240 in data 24/10/2025 per 2.257,00 €
      - MOV-000248 in data 29/10/2025 per 2.257,00 €
      Il fornitore ha rilevato il doppio incasso segnalandolo via email il 31/10/2025 (DOC-EML-012), e l'amministrazione
      ha concordato la compensazione a credito per le forniture successive (DOC-EML-013).
