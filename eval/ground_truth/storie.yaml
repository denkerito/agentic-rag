  - id: "ST-02"
    titolo: "Costo straordinario una tantum per due diligence legale M&A a marzo"
    descrizione: >
      A marzo 2025 si registra un picco anomalo di costi per consulenze straordinarie pari a 12.000,00 € + IVA
      (totale 14.640,00 €) fatturati dallo Studio Legale Ferraris & Associati (FOR-004) per attività di legal
      due diligence finalizzata alla valutazione dell'acquisizione societaria (Project Alpha).
      L'operazione non si è perfezionata a causa di gravi criticità emerse sul target (debiti contributivi e
      mancanza di titolarità IP). Il CdA del 28 marzo 2025 ha deliberato all'unanimità l'abbandono definitivo
      del progetto. Il costo è quindi strettamente straordinario, una tantum e non ripetibile nei mesi successivi.
    evidenze_id:
      fornitore: "FOR-004"
      documenti:
        - "DOC-PRV-001"
        - "DOC-EML-004"
        - "DOC-EML-005"
        - "DOC-EML-006"
        - "DOC-NOT-001"
      fattura: "FATT-P-2025-0037"
      movimento_pagamento: "MOV-000084"
    numeri_chiave:
