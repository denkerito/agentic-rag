storie:
  - id: "ST-01"
    titolo: "Aumento del canone software Nimbus DevOps Enterprise"
    descrizione: >
      Il canone mensile della piattaforma SaaS di sviluppo e CI/CD Nimbus Software S.r.l. (FOR-001)
      aumenta da 4.000,00 € a 5.360,00 € + IVA (+34%, +1.360,00 €/mese) a partire dalla fattura
      di competenza del mese di agosto 2025. L'adeguamento contrattuale è legittimo e conforme
      all'art. 7 del contratto CTR-001, essendo stato preannunciato con oltre 60 giorni di preavviso
      tramite lettera/PEC del 10 giugno 2025. Questo aumento incide sui costi a partire da agosto
      ed è una concausa (ma non l'unica) della flessione del margine operativo registrata ad agosto,
      la cui causa prevalente è invece la riduzione dei ricavi legata alle ferie estive collettive.
