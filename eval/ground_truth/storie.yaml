  - id: "ST-05"
    titolo: "Adeguamento ISTAT ordinario e legittimo del canone di locazione a ottobre"
    descrizione: >
      A partire da ottobre 2025, il canone di locazione degli uffici di Via Tortona 32 fatturato da
      Locazioni Navigli S.r.l. (FOR-003) passa da 3.800,00 € a 3.950,00 € + IVA (+150,00 €/mese).
      Tale aumento non costituisce un'anomalia o un inadempimento contrattuale, ma la corretta e legittima
      applicazione dell'art. 5 del contratto di locazione commerciale CTR-002, basato sull'adeguamento annuale
      al 100% dell'indice ISTAT FOI comunicato con lettera formale del 10 settembre 2025 (DOC-LET-002).
