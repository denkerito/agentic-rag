[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agente AI che investiga dati economici aziendali (SQL + RAG) con fonti verificabili."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai-slim[google]",
    "google-genai",
    "sqlglot",
    "psycopg[binary]",
    "pgvector",
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "logfire",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agentic_rag.db" = ["*.sql"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: richiede il database Postgres in esecuzione"]
addopts = "-m 'not integration'"
